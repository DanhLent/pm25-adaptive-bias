project:
  timezone: "Asia/Ho_Chi_Minh"
  target_latitude: 10.879
  target_longitude: 106.806

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  reports_dir: "reports"
  figures_dir: "outputs/figures"
  metrics_dir: "outputs/metrics"
  predictions_dir: "outputs/predictions"

preprocessing:
  purpleair_resample_rule: "1h"
  cams_resample_rule: "1h"
  residual_ema_alpha: 0.30
  extreme_pm25_upper: 1000
  ab_abs_diff_threshold: 10
  ab_rel_diff_threshold: 0.35

purpleair_qc_policy:
  use_channel_disagree_samples_for_hourly_mean: false
  min_valid_samples_per_hour: 4
  min_good_samples_per_hour: 4
  min_coverage_minutes_per_hour: 30
  hourly_statistic: "median"
  severe_abs_diff_min: 10.0
  severe_rel_diff_min: 0.35
  valid_pm25_min: 0.0
  valid_pm25_max: 1000.0
  full_channel_qc_score: 1.0
  single_channel_qc_score: 0.6
  legacy_hourly_qc_ok: false

forecasting:
  horizons_hours: [1, 3, 6]
  test_fraction: 0.25

alert_thresholds:
  good: 12.0
  moderate: 35.4
  unhealthy_sensitive: 55.4
  unhealthy: 150.4

fusion_alert:
  input_dataset: "data/processed/pm25_fused_hourly_dataset.csv"
  output_timeline: "outputs/predictions/fusion_alert_timeline.csv"
  output_metrics: "outputs/metrics/fusion_alert_metrics.csv"

  residual:
    max_abs_residual: 200.0
    max_abs_correction: 100.0
    decay_when_invalid: 0.95

  confidence:
    strict_source_weight: 1.0
    loose_source_weight: 0.35
    missing_source_weight: 0.0
    bad_fraction_penalty: true
    low_valid_sample_penalty: true
    min_good_valid_samples_per_hour: 4

  single_ema:
    alpha: 0.30

  dual_ema:
    alpha_fast: 0.65
    alpha_slow: 0.18
    trend_gain: 0.50

  early_warning:
    horizons_hours: [1, 3, 6]
    slope_window_hours: 3
    max_abs_slope: 50.0

  alert_logic:
    threshold_exceed: 35.4
    hysteresis_on: 35.4
    hysteresis_off: 32.0
    require_consecutive_on: 1
    require_consecutive_off: 1

data_sources:
  location:
    latitude: 10.879
    longitude: 106.806
    timezone: "Asia/Ho_Chi_Minh"
  openmeteo:
    base_url: "https://air-quality-api.open-meteo.com/v1/air-quality"
    domain: "cams_global"
    hourly_variables: ["pm2_5"]
    default_start_date: "2025-01-01"
    incremental_overlap_days: 1
    reconciliation_hours: 72
  purpleair:
    api_base_url: "https://api.purpleair.com/v1"
    sensor_index: 9520
    api_key_env: "PURPLEAIR_API_KEY"
    default_average_minutes: 10
    initial_lookback_hours: 72
    incremental_overlap_hours: 2
    reconciliation_hours: 72
    live_dir: "data/live/purpleair"
    canonical_live_csv: "data/live/purpleair/purpleair_10min.csv"
    legacy_hourly_csv: "data/live/purpleair/purpleair_live_hourly.csv"
    manual_csv_inputs:
      - "_codex_inputs/raw-pm25-gm (1).csv"
    data_product: "pm25_cf_1"
    canonical_schema_version: 1
    fields:
      - pm2.5_cf_1
      - pm2.5_cf_1_a
      - pm2.5_cf_1_b
      - pm2.5_atm
      - pm2.5_atm_a
      - pm2.5_atm_b
      - humidity
      - temperature
      - pressure
  incremental:
    raw_append_dir: "data/live"
    processed_output: "data/processed/pm25_fused_hourly_dataset.csv"
    latest_output_dir: "outputs/latest"

hardware_aligned:
  model_version: "pm25_core_v1"
  active_alpha_shift: 3
  scale: 16
  hourly_input_csv: "data/processed/pm25_hourly_canonical.csv"
  trace_csv: "outputs/predictions/hardware_aligned_trace.csv"
  state_json: "data/live/state/pm25_pipeline_state.json"
  lock_file: "data/live/state/pm25_unified_pipeline.lock"
  latest_output_dir: "outputs/latest"

operations:
  reconciliation_interval_hours: 24
  backup_interval_hours: 24
  alpha_evaluation_interval_days: 7
  backup_destination: "G:\\My Drive\\PM25_Backup"
  retry_backoff_seconds: [30, 60, 120]
